<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAE - Nova Ocorrência</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --saae-blue: #004b87;
            --saae-light: #009FE3;
            --saae-accent: #f8f9fa;
        }
        body { background-color: var(--saae-accent); font-family: 'Segoe UI', sans-serif; }
        .navbar-saae { background: linear-gradient(90deg, var(--saae-blue) 0%, var(--saae-light) 100%); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-saae mb-5 py-3">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}"><i class="fa-solid fa-droplet me-2"></i>SAAE Monitoramento</a>
        <a href="{% url 'ocorrencias_list' %}" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-arrow-left me-2"></i>Voltar</a>
    </div>
</nav>

<div class="container d-flex justify-content-center">
    <div class="card shadow-sm border-0 w-100" style="max-width: 600px;">
        <div class="card-header bg-white py-3 border-bottom-0">
            <h4 class="fw-bold mb-0" style="color: var(--saae-blue);">Registrar Falta de Água</h4>
            <small class="text-muted">Preencha os dados abaixo para notificar uma nova ocorrência.</small>
        </div>
        
        <div class="card-body px-4 pb-4">
            <!-- A action vazia significa que o form será submetido para a mesma URL -->
            <form method="POST" action="">
                {% csrf_token %}
                
                <!-- Renderização automática dos campos do forms.py -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted">Bairro Afetado</label>
                    {{ form.bairro }}
                    {{ form.bairro.errors }}
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted">Descrição do Problema</label>
                    {{ form.descricao }}
                    {{ form.descricao.errors }}
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted">Status Inicial</label>
                    {{ form.status }}
                    {{ form.status.errors }}
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-lg text-white fw-bold" style="background-color: var(--saae-blue);">
                        Salvar Ocorrência
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
