<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAE - Excluir Bairro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --saae-blue: #004b87; --saae-light: #009FE3; --saae-accent: #f8f9fa; }
        body { background-color: var(--saae-accent); font-family: 'Segoe UI', sans-serif; }
        .navbar-saae { background: linear-gradient(90deg, var(--saae-blue) 0%, var(--saae-light) 100%); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-saae mb-4 py-3">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">SAAE Monitoramento</a>
    </div>
</nav>

<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="fw-bold mb-3 text-danger">Confirmar exclusão</h4>
            <p>Tem certeza que deseja excluir o bairro <strong>{{ object.nome }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'bairro_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger fw-bold">Excluir</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
