<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAE Juazeiro - Dashboard</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Paleta de Cores Baseada na Identidade do SAAE */
        :root {
            --saae-blue: #004b87;       /* Azul institucional escuro */
            --saae-light: #009FE3;      /* Azul água claro */
            --saae-accent: #f8f9fa;     /* Fundo claro */
        }
        
        body {
            background-color: var(--saae-accent);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Barra de Navegação Customizada */
        .navbar-saae {
            background: linear-gradient(90deg, var(--saae-blue) 0%, var(--saae-light) 100%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .navbar-brand {
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Estilização dos Cards com elevação e bordas suaves */
        .card-metric {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s ease-in-out;
        }

        .card-metric:hover {
            transform: translateY(-5px);
        }

        .card-header-icon {
            font-size: 2.5rem;
            opacity: 0.8;
        }

        /* Cores Específicas dos Cards */
        .card-total { border-left: 5px solid var(--saae-blue); }
        .card-pendente { border-left: 5px solid #ffc107; } /* Amarelo alerta */
        .card-resolvido { border-left: 5px solid #198754; } /* Verde sucesso */
        
        .text-saae { color: var(--saae-blue); }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-saae mb-5 py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <i class="fa-solid fa-droplet me-2"></i>
            SAAE Juazeiro - Monitoramento
        </a>
        <div class="navbar-text text-white d-flex align-items-center">
            <a href="{% url 'bairro_list' %}" class="btn btn-sm btn-outline-light me-2">Bairros</a>
            <a href="{% url 'mapa' %}" class="btn btn-sm btn-outline-light me-3">Mapa</a>
            <i class="fa-solid fa-user-circle me-2"></i> {{ request.user.username }}
            <form method="post" action="{% url 'logout' %}" class="d-inline ms-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-light">Sair</button>
            </form>
        </div>
    </div>
</nav>

<!-- Notificação de novas ocorrências pendentes -->
<div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toast-nova-ocorrencia" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toast-mensagem"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- Conteúdo Principal -->
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="text-saae fw-bold mb-0">Visão Geral Operacional</h2>
            <small class="text-muted">Sistema de Notificação de Falta de Água</small>
        </div>
        <a href="{% url 'ocorrencias_list' %}" class="btn text-white fw-bold shadow-sm" style="background-color: var(--saae-blue);">
            <i class="fa-solid fa-list-check me-2"></i>Gerenciar Ocorrências
        </a>
    </div>
    
    <div class="row g-4">
        <!-- Card: Total -->
        <div class="col-md-4">
            <div class="card card-metric card-total h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted text-uppercase fw-bold mb-2">Total de Ocorrências</h6>
                        <h2 class="mb-0 fw-bold text-dark">{{ total }}</h2>
                    </div>
                    <div class="card-header-icon text-saae">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Card: Em andamento -->
        <div class="col-md-4">
            <div class="card card-metric card-pendente h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted text-uppercase fw-bold mb-2">Ocorrências em Andamento</h6>
                        <h2 class="mb-0 fw-bold text-dark">{{ pendentes }}</h2>
                    </div>
                    <div class="card-header-icon text-warning">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Card: Resolvidas -->
        <div class="col-md-4">
            <div class="card card-metric card-resolvido h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted text-uppercase fw-bold mb-2">Ocorrências Resolvidas</h6>
                        <h2 class="mb-0 fw-bold text-dark">{{ resolvidas }}</h2>
                    </div>
                    <div class="card-header-icon text-success">
                        <i class="fa-solid fa-check-double"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Guarda o maior ID de ocorrência pendente já visto, pra detectar só as que chegarem depois
    let ultimoIdConhecido = null;

    function mostrarNotificacao(mensagem) {
        document.getElementById('toast-mensagem').textContent = mensagem;
        const toast = new bootstrap.Toast(document.getElementById('toast-nova-ocorrencia'));
        toast.show();
    }

    async function verificarNovasOcorrencias() {
        try {
            const resposta = await fetch("{% url 'api-ocorrencia-list' %}?status=pendente");
            const ocorrencias = await resposta.json();
            if (ocorrencias.length === 0) {
                return;
            }

            const maiorId = Math.max(...ocorrencias.map(o => o.id));

            if (ultimoIdConhecido === null) {
                ultimoIdConhecido = maiorId;
                return;
            }

            const novas = ocorrencias.filter(o => o.id > ultimoIdConhecido);
            novas.forEach(o => mostrarNotificacao(`Nova ocorrência em andamento em ${o.bairro_nome}`));
            if (novas.length > 0) {
                ultimoIdConhecido = maiorId;
            }
        } catch (erro) {
            console.error('Falha ao verificar novas ocorrências:', erro);
        }
    }

    verificarNovasOcorrencias();
    setInterval(verificarNovasOcorrencias, 10000);
</script>
</body>
</html>
