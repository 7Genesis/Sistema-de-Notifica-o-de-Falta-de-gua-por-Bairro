<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAE - Bairros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --saae-blue: #004b87; --saae-light: #009FE3; --saae-accent: #f8f9fa; }
        body { background-color: var(--saae-accent); font-family: 'Segoe UI', sans-serif; }
        .navbar-saae { background: linear-gradient(90deg, var(--saae-blue) 0%, var(--saae-light) 100%); }
        .table-saae th { background-color: var(--saae-blue); color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-saae mb-4 py-3">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}"><i class="fa-solid fa-droplet me-2"></i>SAAE Monitoramento</a>
        <div class="navbar-text text-white">
            <a href="{% url 'dashboard' %}" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
            <a href="{% url 'ocorrencias_list' %}" class="btn btn-sm btn-outline-light me-2">Ocorrências</a>
            <a href="{% url 'mapa' %}" class="btn btn-sm btn-outline-light me-2">Mapa</a>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-light text-primary">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold" style="color: var(--saae-blue);">Bairros Cadastrados</h3>
        <a href="{% url 'bairro_create' %}" class="btn btn-success fw-bold">
            <i class="fa-solid fa-plus me-2"></i>Novo Bairro
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 table-saae">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for bairro in bairros %}
                        <tr>
                            <td class="align-middle fw-bold">{{ bairro.nome }}</td>
                            <td class="align-middle text-end">
                                <a href="{% url 'bairro_update' bairro.pk %}" class="btn btn-sm btn-outline-primary me-1">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                                <a href="{% url 'bairro_delete' bairro.pk %}" class="btn btn-sm btn-outline-danger">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="2" class="text-center py-4 text-muted">Nenhum bairro cadastrado.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
