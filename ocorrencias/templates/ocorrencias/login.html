<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SAAE Notificações</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --saae-blue: #004b87;
            --saae-light: #009FE3;
            --saae-accent: #f8f9fa;
        }
        
        body {
            background-color: var(--saae-accent);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }

        .login-header {
            background: linear-gradient(90deg, var(--saae-blue) 0%, var(--saae-light) 100%);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }

        .btn-saae {
            background-color: var(--saae-blue);
            color: white;
            transition: all 0.3s;
        }

        .btn-saae:hover {
            background-color: var(--saae-light);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card login-card">
        <div class="login-header">
            <i class="fa-solid fa-droplet fa-3x mb-3"></i>
            <h4 class="mb-0 fw-bold">SAAE Juazeiro</h4>
            <small>Sistema de Notificação Operacional</small>
        </div>
        
        <div class="card-body p-4">
            <!-- Exibição de Erros de Autenticação -->
            {% if form.errors %}
                <div class="alert alert-danger text-center shadow-sm" role="alert">
                    <small>Usuário ou senha inválidos. Tente novamente.</small>
                </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %} <!-- Proteção obrigatória contra ataques CSRF -->
                
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold text-muted">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" class="form-control" name="username" id="username" required autofocus>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label fw-bold text-muted">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" class="form-control" name="password" id="password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-saae w-100 py-2 fw-bold">Entrar no Sistema</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
