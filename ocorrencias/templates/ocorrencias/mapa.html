{{ bairros_data|json_script:"bairros-data" }}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAE - Mapa de Bairros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <style>
        :root { --saae-blue: #004b87; --saae-light: #009FE3; --saae-accent: #f8f9fa; }
        body { background-color: var(--saae-accent); font-family: 'Segoe UI', sans-serif; }
        .navbar-saae { background: linear-gradient(90deg, var(--saae-blue) 0%, var(--saae-light) 100%); }
        #map { height: 70vh; border-radius: 10px; }
        .legenda-cor {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-saae mb-4 py-3">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}"><i class="fa-solid fa-droplet me-2"></i>SAAE Monitoramento</a>
        <div class="navbar-text text-white">
            <a href="{% url 'dashboard' %}" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
            <a href="{% url 'ocorrencias_list' %}" class="btn btn-sm btn-outline-light me-2">Ocorrências</a>
            <a href="{% url 'bairro_list' %}" class="btn btn-sm btn-outline-light me-2">Bairros</a>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="fw-bold mb-3" style="color: var(--saae-blue);">Mapa de Bairros</h3>
    <p class="text-muted">Bairros sem latitude/longitude cadastradas não aparecem no mapa.</p>
    <div class="d-flex gap-4 mb-3">
        <span><span class="legenda-cor" style="background:#dc3545;"></span> Tem ocorrência em andamento</span>
        <span><span class="legenda-cor" style="background:#198754;"></span> Só resolvidas</span>
        <span><span class="legenda-cor" style="background:#6c757d;"></span> Sem ocorrências</span>
    </div>
    <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
    const bairros = JSON.parse(document.getElementById('bairros-data').textContent);

    // Centralizado em Juazeiro-BA por padrão
    const map = L.map('map').setView([-9.4111, -40.4986], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    function corDoBairro(bairro) {
        if (bairro.pendentes > 0) return '#dc3545';
        if (bairro.resolvidas > 0) return '#198754';
        return '#6c757d';
    }

    bairros.forEach(function (bairro) {
        L.circleMarker([bairro.latitude, bairro.longitude], {
            radius: 10,
            color: '#ffffff',
            weight: 2,
            fillColor: corDoBairro(bairro),
            fillOpacity: 0.9,
        })
            .addTo(map)
            .bindPopup(`<strong>${bairro.nome}</strong><br>${bairro.pendentes} em andamento<br>${bairro.resolvidas} resolvida(s)`);
    });
</script>
</body>
</html>
